    <!-- Global Styles -->
    <style>
        @font-face {
            font-family: 'SCHABO Condensed';
            font-style: normal;
            font-weight: normal;
            src: local('SCHABO Condensed'), url('/SCHABO-Condensed.woff') format('woff');
        }

        @font-face {
            font-family: 'Lora';
            font-style: normal;
            font-weight: normal;
            src: local('Lora'), url('/Lora-Regular.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            background: url('/landing_page.webp') top center/cover no-repeat;
            background-attachment: scroll;
            min-height: 6538px;
            color: white;
        }

        .homepage {
            width: 100%;
            min-height: 6538px;
            color: white;
            padding-top: 70px;
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            text-align: center;
            padding: 120px 20px 40px 20px;
            position: relative;
        }

        .hero-content {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 400px;
            position: relative;
            z-index: 10;
        }

        .hero-title {
            font-family: 'SCHABO Condensed', sans-serif;
            font-size: 6rem;
            font-weight: normal;
            margin-bottom: 20px;
            color: white;
            line-height: 1.1;
            text-align: center;
            min-height: 6.6rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .rotating-text {
            display: inline-block;
            animation: fadeInOut 3s ease-in-out;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            10% {
                opacity: 1;
                transform: translateY(0);
            }
            90% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        .hero-subtitle {
            font-family: 'Lora', serif;
            font-size: 1.8rem;
            font-weight: normal;
            font-style: italic;
            color: white;
            margin-bottom: 0;
            line-height: 1.5;
            text-align: center;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(45deg, #FFDA00, #00d4ff);
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 218, 0, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 218, 0, 0.4);
        }

        /* Global page layout styles */
        .page-layout {
            min-height: 100vh;
            width: 100%;
        }

        .page-content {
            width: 100%;
            min-height: calc(100vh - 70px);
            padding-top: 70px;
        }

        /* Ensure all pages inherit the background */
        #app {
            min-height: 100vh;
            width: 100%;
        }

        /* Event Slideshow */
        .event-slideshow {
            width: 100%;
            overflow: hidden;
            position: relative;
            margin-top: 0;
            padding: 60px 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            z-index: 1;
        }

        .slideshow-title {
            font-family: 'Lora', serif;
            font-size: 1.8rem;
            font-style: italic;
            color: white;
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .slideshow-track {
            display: flex;
            gap: 30px;
            animation: scroll 60s linear infinite;
            width: fit-content;
        }

        .slideshow-image {
            height: 250px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .slideshow-image:hover {
            transform: scale(1.05);
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }


        @media (max-width: 768px) {
            .slideshow-image {
                height: 180px;
                width: 300px;
            }

            .event-slideshow {
                margin-top: 40px;
                padding: 30px 0;
            }
        }

        /* Mission Section */
        .mission-section {
            padding: 80px 20px;
            text-align: center;
            margin-top: 100px;
        }

        .mission-title {
            font-family: 'SCHABO Condensed', sans-serif;
            font-size: 6rem;
            font-weight: normal;
            color: white;
            line-height: 1.1;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            margin: 0 0 40px 0;
        }

        .mission-description {
            font-family: 'Lora', serif;
            font-size: 1.5rem;
            font-style: italic;
            color: white;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.8;
            letter-spacing: -0.02em;
        }

        .mission-photos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            max-width: 1000px;
            margin: 60px auto 0;
            padding: 0 20px;
        }

        .mission-photo {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .mission-photo:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        @media (max-width: 768px) {
            .mission-title {
                font-size: 3rem;
            }

            .mission-description {
                font-size: 1.2rem;
            }

            .mission-photos {
                gap: 15px;
            }

            .mission-photo {
                height: 250px;
            }
        }

        @media (max-width: 480px) {
            .mission-photos {
                grid-template-columns: 1fr;
            }

            .mission-photo {
                height: 200px;
            }
        }

    <!-- Freighter Detection Script -->
    <script type="module">
        // Freighter detection with retry mechanism
        window.addEventListener('load', async () => {
            let retryCount = 0;
            const maxRetries = 5;

            async function detectFreighter() {
                if (typeof window.freighterApi !== 'undefined') {
                    try {
                        const result = await window.freighterApi.isConnected();
                        if (result && result.isConnected) {
                            window.freighterReady = true;
                            console.log('✅ Freighter API detected and ready');
                            console.log('   Available methods:', Object.keys(window.freighterApi));
                            return true;
                        }
                    } catch (error) {
                        // Freighter exists but not connected yet
                        console.log('⚠️  Freighter detected but not connected');
                        window.freighterReady = false;
                        return true; // Still detected
                    }
                }
                return false;
            }

            async function checkFreighter() {
                const detected = await detectFreighter();
                if (detected || retryCount++ >= maxRetries) {
                    if (!detected) {
                        console.log('ℹ️  Freighter wallet extension not detected');
                        console.log('   Install from: https://freighter.app/');
                    }
                    return;
                }
                setTimeout(checkFreighter, 500);
            }

            // Start detection after a brief delay
            setTimeout(checkFreighter, 100);
        });
    </script>
