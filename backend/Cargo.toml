[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
dotenvy = "0.15"
thiserror = "2.0"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros", "migrate", "bigdecimal"] }
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
shared = { path = "../shared" }

# Authentication dependencies (Latest versions as of 2025)
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }  # JWT with rust_crypto backend
bcrypt = "0.17"                # Password hashing (v0.17.1)
tower-cookies = "0.11"         # Cookie management (v0.11.0)
sha2 = "0.10"                  # For token hashing (v0.10.9 stable)
time = "0.3"                   # For cookie expiration (v0.3.42)
tower = { version = "0.5", features = ["util"] }  # Latest tower

[lib]
name = "backend"
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"