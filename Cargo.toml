[workspace]
members = ["backend", "frontend", "shared"]
resolver = "2"

# Fast dev builds
[profile.dev]
opt-level = 1
debug = true
incremental = true

# Optimize deps, not your code
[profile.dev.package."*"]
opt-level = 3
debug = false

# Performance optimization: Minimize WASM bundle size for production
[profile.release]
opt-level = "z"         # Optimize for size instead of speed
lto = true              # Link-time optimization (slower build, smaller binary)
codegen-units = 1       # Single codegen unit for maximum optimization
strip = true            # Remove debug symbols
panic = "abort"         # Smaller panic handler (no unwinding)
